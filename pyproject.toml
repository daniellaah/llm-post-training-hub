[project]
name = "llm-post-training-hub"
version = "0.1.0"
description = "Small LLM post-training experiments with MLX, SFT, and LoRA."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mlx>=0.32.2,<0.33",
    "mlx-lm[train]>=0.31.3,<0.32",
    "rich>=15.0.0,<16",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
